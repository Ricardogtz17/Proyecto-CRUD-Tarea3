<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Productos - CRUD Git Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Inventario de Productos</h1>

    <form id="product-form">
      <input type="hidden" id="product-id">
      <div class="form-group">
        <label for="name">Nombre del Producto:</label>
        <input type="text" id="name" placeholder="Ej. Teclado Mecánico" required>
      </div>
      <div class="form-group">
        <label for="price">Precio (RD$):</label>
        <input type="number" id="price" step="0.01" placeholder="Ej. 3500" required>
      </div>
      <div class="form-group">
        <label for="stock">Cantidad:</label>
        <input type="number" id="stock" placeholder="Ej. 10" required>
      </div>
      <button type="submit" id="submit-btn">Guardar Producto</button>
      <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
